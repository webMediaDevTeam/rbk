services:
  mysql:
    image: mysql:8.0
    container_name: rbqbot-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-rbqbot}
      MYSQL_USER: ${DB_USERNAME:-rbqbot}
      MYSQL_PASSWORD: ${DB_PASSWORD:-rbqbot}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - rbqbot-network

  redis:
    image: redis:alpine
    container_name: rbqbot-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - rbqbot-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: rbqbot-backend
    working_dir: /var/www/html
    volumes:
      - ./backend:/var/www/html
    depends_on:
      - mysql
      - redis
    environment:
      APP_ENV: ${APP_ENV:-local}
      APP_DEBUG: ${APP_DEBUG:-true}
      APP_KEY: ${APP_KEY:-base64:92s1h/zBqxotNGYa5BABFqBmrIekcWylXm1b0wkqCNY=}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-rbqbot}
      DB_USERNAME: ${DB_USERNAME:-rbqbot}
      DB_PASSWORD: ${DB_PASSWORD:-rbqbot}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      SESSION_DRIVER: redis
      BROADCAST_CONNECTION: reverb
      REVERB_HOST: 0.0.0.0
      REVERB_PORT: 8080
      REDIS_CLIENT: predis
    ports:
      - "9000:9000"
    networks:
      - rbqbot-network

  backend-dev:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: rbqbot-backend-dev
    working_dir: /var/www/html
    volumes:
      - ./backend:/var/www/html
    depends_on:
      - mysql
      - redis
    environment:
      APP_ENV: ${APP_ENV:-local}
      APP_DEBUG: ${APP_DEBUG:-true}
      APP_KEY: ${APP_KEY:-base64:92s1h/zBqxotNGYa5BABFqBmrIekcWylXm1b0wkqCNY=}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-rbqbot}
      DB_USERNAME: ${DB_USERNAME:-rbqbot}
      DB_PASSWORD: ${DB_PASSWORD:-rbqbot}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      SESSION_DRIVER: redis
      BROADCAST_CONNECTION: reverb
      REVERB_HOST: 0.0.0.0
      REVERB_PORT: 8080
      REDIS_CLIENT: predis
    command: sh -c "cd /var/www/html/public && php -S 0.0.0.0:8000 ../vendor/laravel/framework/src/Illuminate/Foundation/resources/server.php"
    ports:
      - "8000:8000"
    networks:
      - rbqbot-network

  reverb:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: rbqbot-reverb
    working_dir: /var/www/html
    volumes:
      - ./backend:/var/www/html
    depends_on:
      - backend
      - redis
      - mysql
    command: php artisan reverb:start --host=0.0.0.0 --port=8080
    ports:
      - "8080:8080"
    environment:
      APP_ENV: ${APP_ENV:-local}
      APP_DEBUG: ${APP_DEBUG:-true}
      APP_KEY: ${APP_KEY:-base64:92s1h/zBqxotNGYa5BABFqBmrIekcWylXm1b0wkqCNY=}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-rbqbot}
      DB_USERNAME: ${DB_USERNAME:-rbqbot}
      DB_PASSWORD: ${DB_PASSWORD:-rbqbot}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      BROADCAST_CONNECTION: reverb
      REVERB_HOST: 0.0.0.0
      REVERB_PORT: 8080
      REDIS_CLIENT: predis
    networks:
      - rbqbot-network

  queue:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: rbqbot-queue
    working_dir: /var/www/html
    volumes:
      - ./backend:/var/www/html
    depends_on:
      - backend
      - mysql
      - redis
    command: php artisan queue:work --queue=default --tries=3
    environment:
      APP_ENV: ${APP_ENV:-local}
      APP_DEBUG: ${APP_DEBUG:-true}
      APP_KEY: ${APP_KEY:-base64:92s1h/zBqxotNGYa5BABFqBmrIekcWylXm1b0wkqCNY=}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-rbqbot}
      DB_USERNAME: ${DB_USERNAME:-rbqbot}
      DB_PASSWORD: ${DB_PASSWORD:-rbqbot}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      SESSION_DRIVER: redis
      BROADCAST_CONNECTION: reverb
      REDIS_CLIENT: predis
    networks:
      - rbqbot-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: rbqbot-frontend
    working_dir: /app
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    networks:
      - rbqbot-network

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: rbqbot-phpmyadmin
    restart: unless-stopped
    ports:
      - "8081:80"
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
    depends_on:
      - mysql
    networks:
      - rbqbot-network

networks:
  rbqbot-network:
    name: rbqbot-network
    driver: bridge

volumes:
  mysql_data:
    name: mysql_data
