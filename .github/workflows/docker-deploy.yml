name: Deploy to VPS

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        # `envs:` ne fait que TRANSMETTRE des noms de variables : elles doivent
        # exister dans l'environnement de cette étape. Un secret n'y figure que
        # s'il est déclaré ci-dessous. Sans ce bloc, VPS_HOST / APP_KEY / DB_*
        # arrivaient vides sur le VPS -> APP_URL=http:// -> "Invalid URI."
        # au package:discover (déploiement en échec du 30/09 à 07:04).
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_ROOT_PASSWORD: ${{ secrets.DB_ROOT_PASSWORD }}
          APP_KEY: ${{ secrets.APP_KEY }}
          REVERB_APP_ID: ${{ secrets.REVERB_APP_ID }}
          REVERB_APP_KEY: ${{ secrets.REVERB_APP_KEY }}
          REVERB_APP_SECRET: ${{ secrets.REVERB_APP_SECRET }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          command_timeout: 20m

          envs: VPS_HOST,DB_PASSWORD,DB_ROOT_PASSWORD,APP_KEY,REVERB_APP_ID,REVERB_APP_KEY,REVERB_APP_SECRET,GITHUB_REPOSITORY,GITHUB_SHA

          script: |
            set -e

            APP_DIR="$HOME/apps/main"

            echo "==> Deploying $GITHUB_REPOSITORY"
            echo "==> Commit: $GITHUB_SHA"

            # ----------------------------------------
            # 0. Garde-fou : un secret non transmis = .env incomplet
            # ----------------------------------------

            for name in VPS_HOST APP_KEY DB_PASSWORD DB_ROOT_PASSWORD \
                        REVERB_APP_ID REVERB_APP_KEY REVERB_APP_SECRET; do
              value="$(printenv "$name" 2>/dev/null || true)"
              if [ -z "$value" ]; then
                echo "ERREUR: variable $name vide (bloc env:/envs: du workflow)"
                exit 1
              fi
            done

            mkdir -p "$APP_DIR"
            cd "$APP_DIR"

            # ----------------------------------------
            # 1. Code
            # ----------------------------------------

            if [ ! -d ".git" ]; then
              echo "==> Cloning repository"

              git clone "git@github.com:${GITHUB_REPOSITORY}.git" .
            else
              echo "==> Updating repository"

              git fetch origin master
              git checkout master
              git reset --hard origin/master
              git clean -fd
            fi

            # ----------------------------------------
            # 2. Environnement de production
            #    Source unique : docker-compose.prod.yml lit uniquement
            #    MYSQL_* / CORS_* / REVERB_APP_* / VPS_IP / APP_KEY.
            # ----------------------------------------

            cat > .env <<EOF
            APP_NAME="RBQBot"
            APP_ENV=production
            APP_DEBUG=false

            VPS_IP=${VPS_HOST}
            APP_URL=http://${VPS_HOST}
            FRONTEND_URL=http://${VPS_HOST}

            DB_CONNECTION=mysql
            DB_HOST=mysql
            DB_PORT=3306
            DB_DATABASE=rbqbot
            DB_USERNAME=rbqbot
            DB_PASSWORD=${DB_PASSWORD}
            DB_ROOT_PASSWORD=${DB_ROOT_PASSWORD}

            # Bloc lu par docker-compose.prod.yml (service mysql + x-app-env).
            # Mêmes valeurs que DB_* : sans elles, la stack retomberait sur
            # rbqbot/rbqbot/root et l'application ne pourrait plus se connecter.
            MYSQL_DATABASE=rbqbot
            MYSQL_USER=rbqbot
            MYSQL_PASSWORD=${DB_PASSWORD}
            MYSQL_ROOT_PASSWORD=${DB_ROOT_PASSWORD}

            CACHE_STORE=redis
            QUEUE_CONNECTION=redis
            SESSION_DRIVER=redis
            # laravel/reverb n'est pas installé : broadcast vers le journal
            BROADCAST_CONNECTION=log

            REDIS_HOST=redis
            REDIS_PORT=6379
            REDIS_PASSWORD=null

            REVERB_HOST=0.0.0.0
            REVERB_PORT=8080
            REVERB_APP_ID=${REVERB_APP_ID}
            REVERB_APP_KEY=${REVERB_APP_KEY}
            REVERB_APP_SECRET=${REVERB_APP_SECRET}

            # Origines CORS (backend/config/cors.php) : le front est servi
            # depuis la même origine que l'API en production.
            CORS_ALLOWED_ORIGINS=http://${VPS_HOST}

            # URL de l'API compilée dans le bundle Vite : le front parle au
            # gateway sur :80 (le backend n'est plus publié sur :8000).
            VITE_API_URL=http://${VPS_HOST}

            APP_KEY=${APP_KEY}
            EOF

            cp .env backend/.env

            # ----------------------------------------
            # 3. Validation de la configuration
            # ----------------------------------------

            echo "==> Validating Docker Compose"

            docker compose -f docker-compose.prod.yml config --quiet

            # ----------------------------------------
            # 4. Volume MySQL (external dans le compose)
            # ----------------------------------------

            if ! docker volume inspect mysql_data >/dev/null 2>&1; then
              echo "==> Creating volume mysql_data"
              docker volume create mysql_data >/dev/null
            fi

            # ----------------------------------------
            # 5. Build et démarrage
            # ----------------------------------------

            echo "==> Starting Docker services"

            # --remove-orphans : purger les services supprimés du compose
            # (ex. rbqbot-reverb, laissé par le retrait du service et qui
            # tournait en crash-loop avec l'ancien port 8080 publié).
            if ! docker compose -f docker-compose.prod.yml up -d --build --remove-orphans; then
              echo "==> 'up' a échoué — diagnostic"
              docker compose -f docker-compose.prod.yml ps -a
              docker inspect --format 'mysql: status={{.State.Status}} exit={{.State.ExitCode}} health={{.State.Health.Status}}' rbqbot-mysql 2>&1 || true
              docker inspect --format '{{range .State.Health.Log}}{{.Start}} exit={{.ExitCode}} {{.Output}}{{end}}' rbqbot-mysql 2>&1 | tail -6 || true
              echo "==> logs mysql"
              docker compose -f docker-compose.prod.yml logs --tail=150 mysql
              echo "==> logs backend"
              docker compose -f docker-compose.prod.yml logs --tail=60 backend
              exit 1
            fi

            # La config du gateway est un bind mount sur le fichier du
            # dépôt : compose ne la considère pas comme un changement de
            # service, le conteneur n'est pas recréé et nginx garde son
            # ancienne config en mémoire. On le redémarre pour qu'il
            # relise nginx/conf.d/default.conf tel qu'il est dans le dépôt.
            echo "==> Reloading gateway configuration"

            docker compose -f docker-compose.prod.yml restart nginx

            # ----------------------------------------
            # 6. Attente de MySQL
            #     mysqladmin ping renvoie 0 même avec un mauvais mot de
            #     passe : on exécute une vraie requête authentifiée.
            # ----------------------------------------

            echo "==> Waiting for MySQL"

            # Identifiants de l'APPLICATION, lus dans le .env qu'on vient
            # d'écrire : c'est exactement ce compte que Laravel utilisera.
            # On n'utilise pas root : sur cette base il n'est joignable que
            # par socket/localhost, et un essai en TCP échoue avec
            # « Access denied for user 'root'@'127.0.0.1' ».
            DBU="$(sed -n 's/^DB_USERNAME=//p' .env)"
            DBP="$(sed -n 's/^DB_PASSWORD=//p' .env)"

            if [ -z "$DBU" ] || [ -z "$DBP" ]; then
              echo "ERREUR: DB_USERNAME/DB_PASSWORD absents du .env généré"
              exit 1
            fi

            for i in $(seq 1 60); do
              if err="$(docker compose -f docker-compose.prod.yml exec -T mysql \
                mysql -h127.0.0.1 -u"${DBU}" -p"${DBP}" \
                -e "SELECT 1" 2>&1 >/dev/null)"; then

                echo "MySQL is ready (compte ${DBU})"
                break
              fi

              if [ "$i" -eq 60 ]; then
                echo "ERROR: MySQL did not become ready"
                echo "--- dernière erreur du client MySQL ---"
                echo "$err"
                docker compose -f docker-compose.prod.yml ps -a
                docker compose -f docker-compose.prod.yml logs --tail=150 mysql
                exit 1
              fi

              sleep 2
            done

            # ----------------------------------------
            # 7. Attente du backend
            # ----------------------------------------

            echo "==> Waiting for backend"

            for i in $(seq 1 30); do
              if docker compose -f docker-compose.prod.yml exec -T backend \
                php artisan --version >/dev/null 2>&1; then

                echo "Backend is ready"
                break
              fi

              if [ "$i" -eq 30 ]; then
                echo "ERROR: Backend did not become ready"
                docker compose -f docker-compose.prod.yml logs --tail=100 backend
                exit 1
              fi

              sleep 2
            done

            # ----------------------------------------
            # 8. Migrations
            #     Pas de `composer install` ici : vendor est déjà construit
            #     dans l'image (backend/Dockerfile) et il n'y a plus de
            #     bind mount en prod — un install serait perdu au recreate.
            # ----------------------------------------

            echo "==> Running migrations"

            docker compose -f docker-compose.prod.yml exec -T backend \
              php artisan migrate --force

            # ----------------------------------------
            # 9. Optimisations Laravel
            #     route:cache retiré : routes/web.php contient des
            #     closures, l'artisan échouerait et annulerait le deploy.
            # ----------------------------------------

            echo "==> Optimizing Laravel"

            docker compose -f docker-compose.prod.yml exec -T backend \
              php artisan config:cache

            docker compose -f docker-compose.prod.yml exec -T backend \
              php artisan view:cache

            # ----------------------------------------
            # 10. État final
            # ----------------------------------------

            echo "==> Deployment complete"

            docker compose -f docker-compose.prod.yml ps
