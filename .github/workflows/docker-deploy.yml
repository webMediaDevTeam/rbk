
name: Test SSH Connection

on:
  push:
    branches: [master]

jobs:
  test-ssh:
    runs-on: ubuntu-latest

    steps:
      - name: Test SSH and OS
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: 22
          timeout: 30s
          command_timeout: 1m
          script: |
            echo "SSH connection OK"
            echo "=== Remote OS ==="
            uname -a
            echo "=== OS Information ==="
            cat /etc/os-release
