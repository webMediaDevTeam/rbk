name: Deploy Docker to Plesk

on:
  push:
    branches: [ master ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check server environment
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
        run: |
          sudo apt-get install -y sshpass

          echo "=== Checking Git and Docker ==="

          sshpass -p "$SSH_PASSWORD" ssh \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -o ConnectTimeout=30 \
            -p 22 \
            "$SSH_USER@$SSH_HOST" \
            "which git || echo 'Git missing'; which docker || echo 'Docker missing'; which docker-compose || docker compose version || echo 'Docker Compose missing'"