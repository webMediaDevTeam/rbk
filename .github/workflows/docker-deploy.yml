name: Deploy to Production

on:
  push:
    branches: [master]

env:
  DEPLOY_PATH: /var/www/vhosts/crmzdig.test-webmedia.site/httpdocs

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Test SSH connection
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: 22
          timeout: 30s
          script: |
            echo "SSH connection OK"
            whoami
            pwd

      - name: Deploy via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: 22
          timeout: 60s
          script: |
            set -e

            cd ${{ env.DEPLOY_PATH }}

            echo "=== 1. Git ==="
            git status
            git pull origin master

            echo "=== 2. Deploy script ==="
            bash -x deploy.sh

            echo "=== 3. Docker versions ==="
            docker --version
            docker compose version

            echo "=== 4. Docker down ==="
            docker compose down

            echo "=== 5. Docker build/up ==="
            docker compose up -d --build

            echo "=== 6. Docker status ==="
            docker compose ps

            echo "=== Deployment complete ==="
