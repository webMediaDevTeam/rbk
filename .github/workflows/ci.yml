name: CI

# Dette de lint (docs/TODOS.md « CI Linter Debt ») :
#   backend  → Laravel Pint (style) + PHPStan niveau 6 (avec baseline)
#   frontend → ESLint (flat config, eslint.config.js)
#
# Workflow SÉPARÉ du déploiement (.github/workflows/docker-deploy.yml) :
# il ne déclenche rien d'autre que des checks. Les tests PHPUnit ne sont pas
# encore exécutés ici (2 échecs préexistants au moment de l'ajout — voir
# docs/TODOS.md) ; les ajouter = supprimer les 2 échecs de la suite d'abord.
#
# Localement : composer lint / composer analyse (backend), npm run lint (frontend).

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  backend:
    name: Backend — Pint + PHPStan 6
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, dom, fileinfo, pdo, sqlite3
          coverage: none

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ hashFiles('backend/composer.lock') }}
          restore-keys: composer-

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      # larastan peut amorcer l'application : un .env minimal suffit.
      - name: Prepare .env
        run: cp .env.example .env

      - name: Pint (style PSR-12/Laravel)
        run: vendor/bin/pint --test

      - name: PHPStan (niveau 6)
        run: vendor/bin/phpstan analyse --memory-limit=2G --no-progress

  frontend:
    name: Frontend — ESLint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint
