# ============================================================
# Phase 4 — Routeur principal (gateway rbqbot-gateway)
#
#   /                     -> SPA React      (rbqbot-frontend:80)
#   /api                  -> Laravel FPM     (rbqbot-backend:9000)
#   /sanctum/*            -> Laravel FPM     (cookies CSRF de connexion)
#   /index.php            -> Laravel FPM     (front controller)
#   /storage/*            -> uploads (volume backend_uploads)
#
# Les paramètres FastCGI sont partagés via
#   /etc/nginx/snippets/fastcgi-backend.conf  (monté depuis nginx/snippets/)
#
# Résolution des noms différée via le DNS Docker (127.0.0.11) :
# nginx démarre même si un service ne l'est pas encore, et suit les
# changements d'IP des conteneurs sans rechargement.
# ============================================================

# HTTP : challenge Let's Encrypt + redirection vers HTTPS
server {
    listen 80 default_server;
    server_name zdigia.com www.zdigia.com _;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://zdigia.com$request_uri;
    }
}

# HTTPS : application
server {
    listen 443 ssl;
    http2 on;
    server_name zdigia.com www.zdigia.com;

    ssl_certificate     /etc/letsencrypt/live/zdigia.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/zdigia.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    resolver 127.0.0.11 valid=10s ipv6=off;

    # Uploads (avatars, logos)
    client_max_body_size 64m;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 1024;

    # Pas de timeout agressif : files, imports, requêtes longues
    fastcgi_read_timeout 120s;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;

    # --------------------------------------------------------
    # Retirer le site de Google (avec /robots.txt racine, servi par
    # le SPA) : noindex côté en-tête sur TOUTES les réponses (SPA,
    # API, uploads). Aucune localisation du serveur ne redéfinit
    # `add_header`, donc l'en-tête est bien hérité partout.
    # --------------------------------------------------------
    add_header X-Robots-Tag "noindex, nofollow" always;

    set $frontend rbqbot-frontend:80;
    set $backend  rbqbot-backend:9000;

    # Let's Encrypt challenge
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # --------------------------------------------------------
    # 2. API Laravel -> PHP-FPM (front controller)
    #    SCRIPT_FILENAME est résolu par PHP-FPM DANS LE
    #    conteneur backend : chemin /var/www/html/public/index.php
    # --------------------------------------------------------
    location ^~ /api {
        fastcgi_pass $backend;
        fastcgi_index index.php;

        # Paramètres FastCGI partagés (nginx/snippets/fastcgi-backend.conf)
        include /etc/nginx/snippets/fastcgi-backend.conf;
    }

    # --------------------------------------------------------
    # 2bis. Cookies CSRF de Sanctum
    #    Le front appelle `${VITE_API_URL}/sanctum/csrf-cookie`, donc
    #    HORS /api : sans cette route, le gateway renverrait le HTML
    #    du SPA et la connexion échouerait en production.
    # --------------------------------------------------------
    location ^~ /sanctum {
        fastcgi_pass $backend;
        fastcgi_index index.php;

        include /etc/nginx/snippets/fastcgi-backend.conf;
    }

    # --------------------------------------------------------
    # 3. Accès direct au front controller PHP
    # --------------------------------------------------------
    location ~ ^/index\.php$ {
        fastcgi_pass $backend;

        include /etc/nginx/snippets/fastcgi-backend.conf;
    }

    # --------------------------------------------------------
    # 4. Fichiers uploadés (avatars, logos)
    #    /var/www/storage = volume backend_uploads (monté en :ro)
    # --------------------------------------------------------
    location ^~ /storage/ {
        root /var/www;
        access_log off;
        expires 30d;
    }

    # --------------------------------------------------------
    # 5. SPA React + assets statiques (route par défaut)
    # --------------------------------------------------------
    location / {
        proxy_pass http://$frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --------------------------------------------------------
    # 6. Interdictions
    # --------------------------------------------------------
    # Aucun autre script PHP n'est exécutable côté gateway
    location ~ \.php$ {
        return 404;
    }

    # Fichiers cachés (.env, .git, .user.ini...)
    location ~ /\.(?!well-known) {
        deny all;
    }
}
