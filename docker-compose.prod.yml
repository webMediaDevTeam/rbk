services:
  mysql:
    image: mysql:8.0
    container_name: rbqbot-mysql
    restart: always
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-rbqbot}
      MYSQL_USER: ${DB_USERNAME:-rbqbot}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - rbqbot-network

  redis:
    image: redis:alpine
    container_name: rbqbot-redis
    restart: always
    networks:
      - rbqbot-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: rbqbot-backend
    restart: always
    working_dir: /var/www/html
    volumes:
      - ./backend:/var/www/html
    depends_on:
      - mysql
      - redis
    command: php artisan serve --host=0.0.0.0 --port=8000
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: ${APP_KEY}
      APP_URL: http://${VPS_IP}
      FRONTEND_URL: http://${VPS_IP}
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-rbqbot}
      DB_USERNAME: ${DB_USERNAME:-rbqbot}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      SESSION_DRIVER: redis
      BROADCAST_CONNECTION: reverb
      REVERB_HOST: 0.0.0.0
      REVERB_PORT: 8080
      REDIS_CLIENT: predis
    ports:
      - "8000:8000"
    networks:
      - rbqbot-network

  reverb:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: rbqbot-reverb
    restart: always
    working_dir: /var/www/html
    volumes:
      - ./backend:/var/www/html
    depends_on:
      - backend
      - redis
      - mysql
    command: php artisan reverb:start --host=0.0.0.0 --port=8080
    ports:
      - "8080:8080"
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: ${APP_KEY}
      FRONTEND_URL: http://${VPS_IP}
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-rbqbot}
      DB_USERNAME: ${DB_USERNAME:-rbqbot}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      BROADCAST_CONNECTION: reverb
      REVERB_HOST: 0.0.0.0
      REVERB_PORT: 8080
      REDIS_CLIENT: predis
    networks:
      - rbqbot-network

  queue:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: rbqbot-queue
    restart: always
    working_dir: /var/www/html
    volumes:
      - ./backend:/var/www/html
    depends_on:
      - backend
      - mysql
      - redis
    command: php artisan queue:work --queue=default --tries=3
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: ${APP_KEY}
      FRONTEND_URL: http://${VPS_IP}
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-rbqbot}
      DB_USERNAME: ${DB_USERNAME:-rbqbot}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      SESSION_DRIVER: redis
      BROADCAST_CONNECTION: reverb
      REDIS_CLIENT: predis
    networks:
      - rbqbot-network

  scheduler:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: rbqbot-scheduler
    restart: always
    working_dir: /var/www/html
    volumes:
      - ./backend:/var/www/html
    depends_on:
      - backend
      - mysql
      - redis
    command: php artisan schedule:work
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: ${APP_KEY}
      FRONTEND_URL: http://${VPS_IP}
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-rbqbot}
      DB_USERNAME: ${DB_USERNAME:-rbqbot}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      SESSION_DRIVER: redis
      BROADCAST_CONNECTION: reverb
      REDIS_CLIENT: predis
    networks:
      - rbqbot-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: rbqbot-frontend
    restart: always
    working_dir: /app
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "80:5173"
    environment:
      VITE_API_URL: http://${VPS_IP}:8000
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    networks:
      - rbqbot-network

networks:
  rbqbot-network:
    name: rbqbot-network
    driver: bridge

volumes:
  mysql_data:
    name: mysql_data
