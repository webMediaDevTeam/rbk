# ============================================================
# Phase 3 — Stack de PRODUCTION (images seules, reverse proxy)
# Usage : docker compose -f docker-compose.prod.yml up -d
# Lecture des variables : ./.env à la racine
# ============================================================

# Environnement partagé par backend / reverb / queue / scheduler
x-app-env: &app-env
  APP_ENV: production
  APP_DEBUG: "false"
  APP_KEY: ${APP_KEY}
  APP_URL: http://${VPS_IP}
  FRONTEND_URL: http://${VPS_IP}
  # Mêmes valeurs que MySQL (bloc MYSQL_*) : source unique = .env racine
  DB_CONNECTION: mysql
  DB_HOST: mysql
  DB_PORT: "3306"
  DB_DATABASE: ${MYSQL_DATABASE:-rbqbot}
  DB_USERNAME: ${MYSQL_USER:-rbqbot}
  DB_PASSWORD: ${MYSQL_PASSWORD:-rbqbot}
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  REDIS_CLIENT: predis
  CACHE_STORE: redis
  QUEUE_CONNECTION: redis
  SESSION_DRIVER: redis
  # `laravel/reverb` n'est pas installé (aucun usage dans le code) :
  # broadcast vers le journal. Passer à `reverb` après
  # `composer require laravel/reverb` + réactivation du service.
  BROADCAST_CONNECTION: log
  REVERB_HOST: 0.0.0.0
  REVERB_PORT: "8080"
  REVERB_APP_ID: ${REVERB_APP_ID}
  REVERB_APP_KEY: ${REVERB_APP_KEY}
  REVERB_APP_SECRET: ${REVERB_APP_SECRET}
  # Origines CORS acceptées par backend/config/cors.php (sans slash final)
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:8000,http://51.255.192.50}

services:
  # ---------- 1. Base de données ----------
  mysql:
    image: mysql:8.0
    container_name: rbqbot-mysql
    restart: always
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-rbqbot}
      MYSQL_USER: ${MYSQL_USER:-rbqbot}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-rbqbot}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      # Liveness seule : `mysqladmin ping` répond 0 dès que mysqld écoute,
      # même avec un mauvais mot de passe. Le contrôle d'identité réel est
      # fait par le CI (étape « Waiting for MySQL ») qui, lui, affiche
      # l'erreur exacte — un healthcheck strict ici ne serait visible
      # nulle part et bloquerait tout le stack sans explication.
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    networks:
      - rbqbot-network

  # ---------- 2. Administration MySQL ----------
  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: rbqbot-phpmyadmin
    restart: always
    environment:
      PMA_HOST: mysql
      PMA_PORT: "3306"
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
    ports:
      # Localhost uniquement : phpMyAdmin ne doit pas être exposé
      # sur Internet en production (tunnel SSH pour y accéder).
      - "127.0.0.1:8081:80"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - rbqbot-network

  # ---------- 3. Cache / broker de files ----------
  redis:
    image: redis:alpine
    container_name: rbqbot-redis
    restart: always
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      - rbqbot-network

  # ---------- 4. API PHP (FastCGI :9000) ----------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: rbk-backend:prod
    container_name: rbqbot-backend
    restart: always
    working_dir: /var/www/html
    volumes:
      # Code fourni par l'image (pas de bind mount en prod)
      # Uploads persistants : volume pré-rempli depuis l'image au 1er montage
      - backend_uploads:/var/www/html/storage/app/public
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      <<: *app-env
    expose:
      - "9000"
    networks:
      - rbqbot-network

  # ---------- 5. Worker de files ----------
  queue:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: rbk-backend:prod
    container_name: rbqbot-queue
    restart: always
    working_dir: /var/www/html
    volumes:
      - backend_uploads:/var/www/html/storage/app/public
    depends_on:
      backend:
        condition: service_started
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: php artisan queue:work --queue=default --tries=3 --timeout=90
    environment:
      <<: *app-env
    networks:
      - rbqbot-network

  # ---------- 6. Scheduler ----------
  scheduler:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: rbk-backend:prod
    container_name: rbqbot-scheduler
    restart: always
    working_dir: /var/www/html
    volumes:
      - backend_uploads:/var/www/html/storage/app/public
    depends_on:
      backend:
        condition: service_started
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: php artisan schedule:work
    environment:
      <<: *app-env
    networks:
      - rbqbot-network

  # ---------- 7. Frontend (statique, Nginx interne) ----------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # URL de l'API figée à la compilation du bundle Vite
        VITE_API_URL: http://${VPS_IP}
    # Tag distinct de rbk-frontend:latest (stack de dev) : le build de
    # production n'écrase jamais l'image que la stack de dev utilise.
    image: rbk-frontend:prod
    container_name: rbqbot-frontend
    restart: always
    expose:
      - "80"
    networks:
      - rbqbot-network

  # ---------- 8. Reverse proxy (point d'entrée) ----------
  nginx:
    image: nginx:alpine
    container_name: rbqbot-gateway
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d/default.conf:/etc/nginx/conf.d/default.conf:ro
      # Paramètres FastCGI partagés (/api, /sanctum, /index.php)
      - ./nginx/snippets:/etc/nginx/snippets:ro
      # Fichiers statiques du backend (avatars, logos) pour /storage/*
      - ./backend/public:/var/www/public:ro
      - backend_uploads:/var/www/storage:ro
    depends_on:
      - frontend
      - backend
    networks:
      - rbqbot-network

networks:
  rbqbot-network:
    name: rbqbot-network
    driver: bridge

volumes:
  mysql_data:
    name: mysql_data
    # Volume des données réelles (créée par l'ancien déploiement, projet
    # "rbk"). External : compose la réutilise telle quelle, ne l'attribue
    # jamais à un autre projet et ne peut pas la supprimer (down -v).
    # Le CI vérifie son existence avant `up`.
    external: true
  redis_data:
    name: redis_data
  backend_uploads:
    name: backend_uploads
