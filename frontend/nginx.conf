server {
    listen 80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Assets hashés par Vite (durée de vie longue, immutable)
    location /build/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Fallback SPA : toutes les routes inconnues renvoient index.html
    # (routing côté React Router)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Ne jamais servir un fichier source en cas de mauvaise racine
    location ~* \.(map|log)$ {
        deny all;
    }
}
