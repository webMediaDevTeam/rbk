<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGlowLight" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F4F4F5"/>
    </radialGradient>
  </defs>

  <!-- App Icon Background Frame (Light / White Substrate) -->
  <rect width="512" height="512" rx="112" fill="url(#bgGlowLight)"/>
  <rect width="508" height="508" x="2" y="2" rx="110" fill="none" stroke="#E4E4E7" stroke-width="4"/>

  <!-- Grid / Soundwave background accent lines (Inverted subtle gray) -->
  <g opacity="0.4" stroke="#E4E4E7" stroke-width="2">
    <line x1="96" y1="0" x2="96" y2="512"/>
    <line x1="256" y1="0" x2="256" y2="512"/>
    <line x1="416" y1="0" x2="416" y2="512"/>
    <line x1="0" y1="256" x2="512" y2="256"/>
  </g>

  <!-- Headset Outer Arc (Black) -->
  <path d="M120 270 C120 160 392 160 392 270" fill="none" stroke="#09090b" stroke-width="22" stroke-linecap="round"/>

  <!-- Bot Head Enclosure (Black) -->
  <rect x="156" y="180" width="200" height="175" rx="54" fill="#09090b"/>

  <!-- Bot Face Screen / Visor (White) -->
  <rect x="180" y="212" width="152" height="96" rx="28" fill="#FFFFFF"/>

  <!-- AI Voice Wave / Sound Pulse Eyes inside visor (Black) -->
  <g fill="#09090b">
    <!-- Left Eye Audio Wave -->
    <rect x="204" y="246" width="6" height="28" rx="3"/>
    <rect x="216" y="238" width="8" height="44" rx="4"/>
    <rect x="230" y="246" width="6" height="28" rx="3"/>

    <!-- Right Eye Audio Wave -->
    <rect x="276" y="246" width="6" height="28" rx="3"/>
    <rect x="288" y="238" width="8" height="44" rx="4"/>
    <rect x="302" y="246" width="6" height="28" rx="3"/>
  </g>

  <!-- Headset Earcups (Black) -->
  <rect x="100" y="235" width="32" height="74" rx="16" fill="#09090b"/>
  <rect x="380" y="235" width="32" height="74" rx="16" fill="#09090b"/>

  <!-- Headset Mic Arm & Capsule (Black) -->
  <path d="M396 295 C396 385 305 408 265 408" fill="none" stroke="#09090b" stroke-width="18" stroke-linecap="round"/>
  <rect x="232" y="394" width="36" height="26" rx="12" fill="#09090b"/>
  <!-- Mic sound slot (White) -->
  <line x1="242" y1="407" x2="258" y2="407" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/>

  <!-- Antenna / Signal Node (Black) -->
  <line x1="256" y1="180" x2="256" y2="135" stroke="#09090b" stroke-width="18" stroke-linecap="round"/>
  <circle cx="256" cy="118" r="16" fill="#09090b"/>
  <!-- Audio Ring Broadcast Arc (Black) -->
  <path d="M226 100 C242 88 270 88 286 100" fill="none" stroke="#09090b" stroke-width="6" stroke-linecap="round"/>
</svg>
