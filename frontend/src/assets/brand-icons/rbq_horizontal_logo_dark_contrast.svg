<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" width="1000" height="320">
  <!-- Deep Obsidian Dark Background -->
  <rect width="1000" height="320" fill="#09090b" rx="28"/>
  <rect width="996" height="316" x="2" y="2" fill="none" stroke="#27272a" stroke-width="2" rx="26"/>

  <!-- Mark Container (Left) - Inverted Bot with dark inner faceplate & bright glowing waveform eyes -->
  <g transform="translate(60, 40)">
    <!-- Headset Band (White) -->
    <path d="M45 130 C45 60 195 60 195 130" fill="none" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round"/>
    
    <!-- Bot Head Base (White) -->
    <rect x="65" y="70" width="110" height="96" rx="30" fill="#FFFFFF"/>
    
    <!-- Visor (Pitch Black) -->
    <rect x="78" y="88" width="84" height="52" rx="16" fill="#09090b"/>
    
    <!-- AI Voice Spectrum Eyes (Glowing White) -->
    <rect x="91" y="106" width="4" height="16" rx="2" fill="#FFFFFF"/>
    <rect x="99" y="101" width="5" height="26" rx="2.5" fill="#FFFFFF"/>
    <rect x="108" y="106" width="4" height="16" rx="2" fill="#FFFFFF"/>
    
    <rect x="128" y="106" width="4" height="16" rx="2" fill="#FFFFFF"/>
    <rect x="136" y="101" width="5" height="26" rx="2.5" fill="#FFFFFF"/>
    <rect x="145" y="106" width="4" height="16" rx="2" fill="#FFFFFF"/>

    <!-- Ear Cushions (White) -->
    <rect x="34" y="108" width="18" height="42" rx="9" fill="#FFFFFF"/>
    <rect x="188" y="108" width="18" height="42" rx="9" fill="#FFFFFF"/>

    <!-- Microphone (White) -->
    <path d="M198 140 C198 190 148 202 124 202" fill="none" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round"/>
    <rect x="105" y="194" width="22" height="16" rx="7" fill="#FFFFFF"/>

    <!-- Top Antenna (White) -->
    <line x1="120" y1="70" x2="120" y2="44" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round"/>
    <circle cx="120" cy="34" r="9" fill="#FFFFFF"/>
  </g>

  <!-- Divider Line -->
  <line x1="320" y1="60" x2="320" y2="260" stroke="#27272a" stroke-width="2"/>

  <!-- Typographic Wordmark & Descriptor (White & Slate) -->
  <g transform="translate(365, 0)">
    <!-- Primary Acronym: RBQ -->
    <text x="0" y="160" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="108" font-weight="900" fill="#FFFFFF" letter-spacing="6">RBQ</text>
    
    <!-- AI Call Center Accent Tag -->
    <rect x="290" y="90" width="112" height="34" rx="8" fill="#27272a"/>
    <text x="346" y="113" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="2">AI VOICE</text>
    
    <!-- Subtitle / Positioning -->
    <text x="2" y="210" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="700" fill="#D4D4D8" letter-spacing="4">CALL CENTER AUTOMATION</text>
    <text x="2" y="240" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#A1A1AA" letter-spacing="2">INTELLIGENT CONVERSATIONAL AGENT • 24/7 SUPPORT</text>
  </g>
</svg>
