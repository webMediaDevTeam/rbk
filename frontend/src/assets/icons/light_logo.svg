    <path d="M118 265 C118 152 394 152 394 265" fill="none" stroke="#FFFFFF" stroke-width="22" stroke-linecap="round"/>

    <!-- Bot Head Enclosure (White) -->
    <rect x="156" y="176" width="200" height="178" rx="54" fill="#FFFFFF"/>

    <!-- Bot Face Screen / Visor in oklch(51.8% 0.253 323.949) -->
    <rect x="178" y="208" width="156" height="100" rx="28" fill="oklch(51.8% 0.253 323.949)"/>

    <!-- AI Voice Wave / Sound Pulse Eyes inside visor (White) -->
    <g fill="#FFFFFF">
      <!-- Left Eye Audio Wave -->
      <rect x="202" y="244" width="7" height="28" rx="3.5"/>
      <rect x="215" y="235" width="9" height="46" rx="4.5"/>
      <rect x="230" y="244" width="7" height="28" rx="3.5"/>

      <!-- Right Eye Audio Wave -->
      <rect x="275" y="244" width="7" height="28" rx="3.5"/>
      <rect x="288" y="235" width="9" height="46" rx="4.5"/>
      <rect x="303" y="244" width="7" height="28" rx="3.5"/>
    </g>

    <!-- Headset Earcups (White) -->
    <rect x="96" y="230" width="34" height="76" rx="17" fill="#FFFFFF"/>
    <rect x="382" y="230" width="34" height="76" rx="17" fill="#FFFFFF"/>

    <!-- Headset Mic Arm & Capsule (White) -->
    <path d="M400 292 C400 388 305 412 265 412" fill="none" stroke="#FFFFFF" stroke-width="19" stroke-linecap="round"/>
    <rect x="230" y="398" width="38" height="28" rx="14" fill="#FFFFFF"/>
    <!-- Mic sound slot in oklch(51.8% 0.253 323.949) -->
    <line x1="240" y1="412" x2="258" y2="412" stroke="oklch(51.8% 0.253 323.949)" stroke-width="4.5" stroke-linecap="round"/>

    <!-- Antenna / Signal Node (White) -->
    <line x1="256" y1="176" x2="256" y2="130" stroke="#FFFFFF" stroke-width="19" stroke-linecap="round"/>
    <circle cx="256" cy="112" r="17" fill="#FFFFFF"/>
    <!-- Audio Ring Broadcast Arc (White) -->
    <path d="M224 94 C242 80 270 80 288 94" fill="none" stroke="#FFFFFF" stroke-width="6.5" stroke-linecap="round"/>
