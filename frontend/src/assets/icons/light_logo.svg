    <line x1="96" y1="0" x2="96" y2="512"/>
    <line x1="256" y1="0" x2="256" y2="512"/>
    <line x1="416" y1="0" x2="416" y2="512"/>
    <line x1="0" y1="256" x2="512" y2="256"/>
  </g>

  <!-- Scaled up bot icon (reversed from IMAGE_3: chassis/headset become white, visor becomes oklch(51.8% 0.253 323.949), soundwaves become white) -->
