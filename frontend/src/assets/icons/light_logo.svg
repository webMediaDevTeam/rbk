<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background subtle radial gradient centered around vibrant oklch(51.8% 0.253 323.949) -->
    <radialGradient id="bgMagentaInverted" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="oklch(56% 0.26 323.949)"/>
      <stop offset="100%" stop-color="oklch(48% 0.24 323.949)"/>
    </radialGradient>
  </defs>

  <!-- App Icon Background Frame in oklch(51.8% 0.253 323.949) -->
  <rect width="512" height="512" rx="112" fill="url(#bgMagentaInverted)"/>
  <rect width="508" height="508" x="2" y="2" rx="110" fill="none" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="3"/>

  <!-- Subtle grid lines in background -->
