<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Inverted Favicon: Clean White Background with soft border -->
  <rect width="64" height="64" rx="14" fill="#FFFFFF"/>
  <rect width="62" height="62" x="1" y="1" rx="13" fill="none" stroke="#E4E4E7" stroke-width="1.5"/>

  <!-- Headset Outer Arc (Black) -->
  <path d="M15 32 C15 19 49 19 49 32" fill="none" stroke="#09090b" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Bot Head Base (Black) -->
  <rect x="18" y="20" width="28" height="24" rx="8" fill="#09090b"/>
  <!-- Inner Visor (White) -->
  <rect x="22" y="25" width="20" height="12" rx="4" fill="#FFFFFF"/>
  
  <!-- Eyes inside visor (Black) -->
  <circle cx="27" cy="31" r="2.5" fill="#09090b"/>
  <circle cx="37" cy="31" r="2.5" fill="#09090b"/>

  <!-- Headset Ear cushions (Black) -->
  <rect x="13" y="28" width="4" height="9" rx="2" fill="#09090b"/>
  <rect x="47" y="28" width="4" height="9" rx="2" fill="#09090b"/>

  <!-- Mic boom & tip (Black) -->
  <path d="M48 35 C48 45 38 48 34 48" fill="none" stroke="#09090b" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="33" cy="48" r="2" fill="#09090b"/>

  <!-- Soundwave / Antenna top (Black) -->
  <line x1="32" y1="20" x2="32" y2="14" stroke="#09090b" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="32" cy="12" r="2" fill="#09090b"/>
</svg>
